<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runas y Símbolos · Runarka</title>
    <meta
      name="description"
      content="El significado de las runas y cómo acompañan a cada pieza de Runarka."
    />

    <!-- Tema ANTES de pintar: sin esto se ve un flash blanco en cada
         navegación cuando la persona eligió modo oscuro. -->
    <script>
      try {
        var t = localStorage.getItem("runarka_theme") || "dark";
        document.documentElement.dataset.theme = t === "dark" ? "dark" : "";
      } catch (e) {}
    </script>

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Estilos (orden importa: tokens → base → componentes → layout → features) -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/cart.css" />
  </head>
  <body>
    <site-header></site-header>

    <main>
      <section class="section">
        <div class="container">
          <div class="section__head">
            <div class="rune-divider">ᚱ</div>
            <h1>Runas y Símbolos</h1>
            <p>Qué dice cada runa y cómo acompaña a la pieza que la lleva.</p>
          </div>

          <!-- El texto se edita en contenido.json → clave "runas" -->
          <div class="prosa" data-contenido="runas"></div>
        </div>
      </section>
    </main>

    <site-footer></site-footer>

    <cart-drawer></cart-drawer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
